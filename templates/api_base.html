<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %} {% endblock %}
    </title>
    <script src='/static/jquery/jquery-4.0.0.min.js'></script>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static '/BootStrap/icons/bootstrap-icons.css' %}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Subtle off-white for a modern, clean look */
        }
        .main-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
    </style>
    {% block head %} {% endblock %}
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-check2-square me-2"></i>TodoApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-index nav-link active" href="#">Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main body of application -->
    <main class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-10">
                
                <div class="card main-card p-4 bg-white">
                    {% block content %} {% endblock %}
                </div>

            </div>
        </div>
    </main>

    <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
