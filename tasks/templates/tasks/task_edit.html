{% extends 'base.html' %}

{% block title %}
Edit Task
{% endblock %}


{% block content %}
    <div>
        <h2> Title: </h2>
        <h3> {{task.title}} </h3>
    </div>
 
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
    <input type="submit" value="Apply Updates">
    </form>
    {% for message in messages %}
        <div class="alert alert-primary" role="alert">
            {{message}}
        </div>
    {% endfor %}

{% endblock %}
